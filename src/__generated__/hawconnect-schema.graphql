"""Prices for different types of customers"""
type Prices {
  """Price for employees"""
  employee: Float

  """Price for guests"""
  guest: Float

  """Price for students"""
  student: Float
}

"""Root query"""
type Query {
  academicCalendar: AcademicCalendarResponse!
  accountSnapshot: AccountSyncSnapshot!

  """Get the current announcements"""
  announcements: [Announcement!]! @deprecated(reason: "Use appAnnouncements query instead")

  """Get the current in app announcements."""
  appAnnouncements(active: Boolean): [Announcement!]!

  """
  Get the audit log entries. Note: This query is only available for authenticated admin users.
  """
  auditLog(limit: Int, offset: Int): [AuditLogEntry!]!
  campusLifeEvents: CampusLifePublicFeed!

  """Get all events of the career service."""
  careerServiceEvents: [CareerServiceEvent!]! @deprecated(reason: "Use the replacement career service events API instead")

  """Get all campus life clubs"""
  clClubs: [Host!]! @deprecated(reason: "Use Campus Life API instead")

  """Get the campus life events"""
  clEvents: [ClEvent!]! @deprecated(reason: "Use Campus Life API instead")

  """Get the meal plan for a specific restaurant."""
  food(language: String = "de", locations: [LocationInput!]!): FoodResponse!
  hawClubs(language: String = "de"): HawClubsResponse!
  hawEvents(language: String = "de"): HawEventsResponse!

  """
  Get the room reports. Note: This query is only available for authenticated users.
  """
  roomReports: [RoomReport!]!

  """Get all events of the Student Counselling Office."""
  studentCounsellingEvents: [StudentCounsellingEvent!]! @deprecated(reason: "Use the replacement student counselling events API instead")
}

"""
Enum representing the different restaurant locations. This is used as a parameter for the food query.
"""
enum RestaurantLocation {
  BergedorfMensa
  BerlinerTorMensa
  FinkenauMensa
}

"""Get all room reports. Contains user reports of wrong room data."""
type RoomReport {
  """Creation date of the report"""
  createdAt: DateTime!

  """description of the report"""
  description: String

  """Unique identifier of the report"""
  id: ID!

  """Reason for the report. This is a enum wiht report categories."""
  reason: RoomReportCategory!

  """Resolved date of the report or null if not resolved"""
  resolvedAt: DateTime

  """Room name"""
  room: String!
}

"""
Enum representing the different room report categories. This is used to categorize the reason for the report.
"""
enum RoomReportCategory {
  MISSING
  NOT_EXISTING
  OTHER
  WRONG_DESCRIPTION
  WRONG_LOCATION
}

"""
Room report input type. Used to create a new report about incorrect room data.
"""
input RoomReportInput {
  """description of the report"""
  description: String

  """Reason for the report."""
  reason: RoomReportCategory!

  """Room name"""
  room: String!
}

