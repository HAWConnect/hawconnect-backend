"Private, account-scoped sync record. Payload is JSON; transport requires a verified session."
type AccountSyncRecord {
    kind: String!
    entityId: ID!
    revision: Int!
    deleted: Boolean!
    payloadJson: String!
}
type AccountSyncConflict {
    kind: String!
    entityId: ID!
    revision: Int!
}
type AccountSyncSnapshot {
    records: [AccountSyncRecord!]!
}
type AccountSyncResult {
    records: [AccountSyncRecord!]!
    conflicts: [AccountSyncConflict!]!
}

